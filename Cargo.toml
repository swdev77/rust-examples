[package]
name = "axum-firebirdsql"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15.7"


sqlx = { 
    version = "0.9.0", 
    default-features = false, 
    features = ["runtime-tokio", "tls-native-tls", "macros"] 
}
sqlx-firebirdsql = { version = "0.1", features = ["offline"] } # Firebird uchun uchinchi tomon drayveri

tracing = "0.1.44"
tracing-subscriber = "0.3.23"
thiserror = "2.0.19"
